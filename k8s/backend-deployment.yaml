apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 269469929419.dkr.ecr.ap-southeast-2.amazonaws.com/monitoring-backend:v1

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 500m
              memory: 512Mi

            limits:
              cpu: 700m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 9
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
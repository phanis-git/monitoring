kind: ClusterConfig
metadata:
    name: monitoring-dev
    region: us-east-1
managedNodeGroups:
- name: monitoring-nodes
  # instanceTypes: ["m5.large","t3.small", "t3.medium","c5.large"]
  instanceTypes: ["t3.micro", "t3.small","t8i.small"]
  desiredCapacity: 2 #  by default this value is 3
  spot: true
  
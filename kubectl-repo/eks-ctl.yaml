apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
    name: monitoring-dev
    region: ap-southeast-2
managedNodeGroups:
- name: monitoring-nodes
  # instanceTypes: ["m5.large","t3.small", "t3.medium","c5.large"]
  instanceTypes: ["t3.small","t8i.small"]
  desiredCapacity: 4 #  by default this value is 3
  minSize: 3
  maxSize: 5
  spot: true
  